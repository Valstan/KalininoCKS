# Конфигурация сканера секретов PR-гейта (.github/workflows/ci.yml).
# Дефолтный набор правил gitleaks остаётся включённым — здесь только исключение.

[extend]
useDefault = true

[[allowlists]]
description = """
scripts/.work/ — рабочие дампы VK-выгрузки (vk-fetch → wall.json). В PR #12 файл
попал в Git по недосмотру и лежал в дереве до PR #19, где убран из индекса и внесён
в .gitignore. В истории он остаётся: `main` защищён, переписывание истории и
force-push запрещены (AGENTS.md), а находки — не наши учётные данные, а
access_key/web_view_token медиа-объектов публичной стены сообщества ВК.
Каталог регенерируемый и игнорируемый, реальные секреты сюда попасть не могут.
"""
paths = ['''^scripts/\.work/''']
