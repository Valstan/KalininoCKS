name: Apply DB migration (manual)

# Применяет ОДНУ Payload-миграцию (зеркальный .sql) на прод по SSH из Actions.
# Нужен, т.к. (а) `payload migrate` в CI/standalone недоступен/висит, (б) локальный
# SSH разработчика бывает недоступен, а раннер Actions достукивается. Запуск —
# вручную (workflow_dispatch) ДО деплоя кода, затем штатный деплой через
# workflow_dispatch (migration-guard пропускает dispatch).
#
# Идемпотентность — на стороне .sql (ADD COLUMN IF NOT EXISTS). Запись в
# payload_migrations — best-effort.
#
# Требует те же доступы, что deploy-prod.yml:
#   secrets.SSH_PRIVATE_KEY, secrets.DEPLOY_SSH_HOST, secrets.DEPLOY_SSH_USER,
#   secrets.PROD_ENV_FILE, vars.DEPLOY_SSH_PORT — и sudo без пароля на проде.
#
# Регистр: DATABASE_URI читаем через sudo — env-файл закрыт для пользователя деплоя
# (root-only). Путь к нему в этом файле не хранится (AGENTS.md §🛡 Публичный
# репозиторий). ⚠️ Он именно в `secrets`, а не в `vars`: раннер печатает блок `env:`
# шага в лог с раскрытыми значениями и маскирует только `secrets`, а логи публичного
# репозитория публичны.

on:
  workflow_dispatch:
    inputs:
      migration:
        description: 'Имя миграции без расширения (web/src/migrations/<name>.sql)'
        required: true
        default: '20260621_000000'

concurrency:
  group: prod-db
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -e
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$DEPLOY_SSH_HOST" ] || [ -z "$DEPLOY_SSH_PORT" ] || [ -z "$DEPLOY_SSH_USER" ]; then
            echo "::error::Заданы не все: secrets.SSH_PRIVATE_KEY / secrets.DEPLOY_SSH_HOST / vars.DEPLOY_SSH_PORT / secrets.DEPLOY_SSH_USER"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519_kalinino
          chmod 600 ~/.ssh/id_ed25519_kalinino
          ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<CFG
          Host kalinino
            HostName $DEPLOY_SSH_HOST
            Port $DEPLOY_SSH_PORT
            User $DEPLOY_SSH_USER
            IdentityFile ~/.ssh/id_ed25519_kalinino
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
          CFG
          chmod 600 ~/.ssh/config

      - name: Preflight (read-only)
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          set -e
          if [ -z "$PROD_ENV_FILE" ]; then
            echo "::error::secrets.PROD_ENV_FILE не задан — неоткуда прочитать DATABASE_URI на сервере"
            exit 1
          fi
          ssh kalinino 'bash -s' "$PROD_ENV_FILE" <<'REMOTE'
          set -e
          ENV_FILE="$1"
          DB=$(sudo -n cat "$ENV_FILE" | grep '^DATABASE_URI=' | head -1 | sed 's/^DATABASE_URI=//;s/^"//;s/"$//')
          # Пустой DB опаснее ошибки чтения: libpq молча уйдёт на локальный сокет и БД
          # по имени пользователя, то есть DDL приедет не туда. Пайплайн выше вернул бы
          # успех и без файла — статус у него от sed.
          [ -n "$DB" ] || { echo "::error::DATABASE_URI не прочитан из env-файла сервиса"; exit 1; }
          # psql отдельной командой, а не внутри echo "$(…)" — иначе его код возврата теряется.
          psql "$DB" -tAc "SELECT to_regclass('public.payload_migrations');"
          REMOTE

      - name: Apply migration
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
          MIGRATION: ${{ inputs.migration }}
        run: |
          set -e
          # Имя миграции — свободный текст из диалога запуска. Через `env:`, а не
          # подстановкой в тело скрипта, и с проверкой формы: кавычка или апостроф
          # иначе разорвали бы либо строку шелла, либо SQL-литерал на проде.
          case "$MIGRATION" in
            '' | *[!A-Za-z0-9_-]* ) echo "::error::Недопустимое имя миграции: разрешены латиница, цифры, _ и -"; exit 1 ;;
          esac
          SQL="web/src/migrations/$MIGRATION.sql"
          test -f "$SQL" || { echo "::error::Нет файла $SQL"; exit 1; }
          scp -q "$SQL" kalinino:/tmp/mig.sql
          ssh kalinino 'bash -s' "$MIGRATION" "$PROD_ENV_FILE" <<'REMOTE'
          set -e
          NAME="$1"
          ENV_FILE="$2"
          DB=$(sudo -n cat "$ENV_FILE" | grep '^DATABASE_URI=' | head -1 | sed 's/^DATABASE_URI=//;s/^"//;s/"$//')
          [ -n "$DB" ] || { echo "::error::DATABASE_URI не прочитан из env-файла сервиса"; exit 1; }
          echo "Применяю $NAME ..."
          psql "$DB" -v ON_ERROR_STOP=1 -f /tmp/mig.sql
          # запись в реестр — best-effort и идемпотентно.
          psql "$DB" -c "INSERT INTO payload_migrations (name, batch) SELECT '$NAME', (SELECT COALESCE(MAX(batch),0)+1 FROM payload_migrations) WHERE NOT EXISTS (SELECT 1 FROM payload_migrations WHERE name='$NAME');" \
            && echo "записано в payload_migrations" || echo "payload_migrations нет — запись пропущена (колонка применена)"
          rm -f /tmp/mig.sql
          echo "verify: записей '$NAME' в payload_migrations (>=1 = в реестре; 0 — реестра ещё нет):"
          psql "$DB" -tAc "SELECT count(*) FROM payload_migrations WHERE name = '$NAME';" 2>/dev/null \
            || echo "0 (payload_migrations недоступна — колонка применена, реестр досоздаст payload migrate)"
          REMOTE
